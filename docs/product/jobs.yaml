jobs:
  - id: explore-system-dynamics
    story: >
      When I am running a systems thinking session with a team, I want to build
      and run a causal loop diagram in real time, so I can surface non-obvious
      dynamics and anchor the team's conversation in a shared, running model.
    journey: build-and-run-model
    validated: retroactive
    notes: >
      Core primary job. Covers the full build → simulate → inject → observe →
      share arc. Retroactively authored from PRD §1.2 and observed use patterns.

  - id: resume-ongoing-work
    story: >
      When I return to a model I was building across sessions, or open a
      colleague's shared model, I want my work to be exactly where I left it
      without accidentally overwriting anyone else's, so I can continue without
      losing context.
    journey: persist-and-resume
    validated: retroactive
    notes: >
      Persistence and cross-session continuity job. Covers auto-save, restore,
      transient fork, legacy migration, and new model. Retroactively authored
      from PRD §4.3 (SE-07–SE-10) and DR--20260329.

  - id: share-complex-model
    story: >
      When I have built a complex causal loop diagram, I want to share it via a
      URL that fits in a chat message, so I can invite a colleague to view or continue
      the model without losing work.
    feature: share-url-compression
    validated: discuss-wave
    notes: JTBD skipped — motivation clear from user description

  - id: navigate-diagram-viewport
    story: >
      When my causal loop diagram grows beyond what fits on one screen during a
      live facilitation session, I want to pan and zoom the canvas smoothly and
      always be able to snap back to a full, readable view, so I can keep
      working with any part of the model and keep the group oriented without
      ever pausing to reload the page.
    journey: canvas-pan-zoom-navigation
    validated: discuss-wave
    notes: >
      Single job covering three sub-motivations (pan / zoom / reset-to-fit) —
      treated as one job, not three, because all three share the same Push
      (canvas has no camera; off-screen or over/under-zoomed content becomes
      unreachable) and the same core outcome (stay oriented without
      interrupting the session). Opportunity scoring skipped: only one job
      identified for this feature. Enables the existing explore-system-dynamics
      job at larger diagram sizes; does not replace it. Full JTBD analysis
      (job dimensions, four forces) in docs/feature/canvas-pan-zoom-navigation/
      feature-delta.md — DISCUSS pre-authorized full JTBD per user selection
      of "Full nWave DISCUSS", not derived from user interviews (no DISCOVER/
      DIVERGE wave preceded this feature — flagged as a validation risk).
