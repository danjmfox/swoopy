image: node:22-bullseye-slim

variables:
  PNPM_HOME: $CI_PROJECT_DIR/.pnpm-store

# Cache pnpm store across jobs to speed up installations.
# We use the lockfile as the key so we only re-download when dependencies change.
cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store

stages:
  - setup
  - validate
  - test
  - build

# Common template for all pnpm-based jobs
.pnpm_template:
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm config set store-dir $PNPM_HOME
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

install:
  extends: .pnpm_template
  stage: setup
  script:
    - pnpm install --frozen-lockfile

# Trunk-based lint runs on GitHub Actions via trunk-io/trunk-action.
# No equivalent available on GitLab runners; omitted intentionally.

typecheck:
  extends: .pnpm_template
  stage: validate
  script:
    # This enforces the "any is a build error" requirement from the PRD
    - pnpm typecheck

test:engine:
  extends: .pnpm_template
  stage: test
  script:
    - pnpm --filter "./packages/engine" test

test:renderer:
  extends: .pnpm_template
  stage: test
  script:
    - pnpm --filter "./packages/renderer" test

test:app:
  extends: .pnpm_template
  stage: test
  script:
    - pnpm --filter "./packages/app" test

build:app:
  extends: .pnpm_template
  stage: build
  script:
    # Ensuring the Vite build succeeds is a final sanity check for MRs
    - pnpm --filter "./packages/app" build
  artifacts:
    paths:
      - packages/app/dist/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
